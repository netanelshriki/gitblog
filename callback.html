<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication Callback - GitBlog</title>
  <style>
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    
    .card {
      background-color: white;
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      padding: 2rem;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(99, 102, 241, 0.1);
      border-radius: 50%;
      border-top-color: #6366f1;
      animation: spin 1s ease-in-out infinite;
      margin: 2rem auto;
    }
    
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <i class="fas fa-book-open" style="color: #6366f1; margin-right: 0.5rem;"></i>
      GitBlog
    </div>
    <h2>Completing Authentication</h2>
    <p>Please wait while we complete the authentication process...</p>
    <div class="spinner"></div>
    <p id="status-message">Authenticating with GitHub...</p>
  </div>

  <script>
    // Extract the authorization code from the URL
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    
    // In a production implementation, you would send this code to your server
    // to exchange it for an access token.
    
    // For demo purposes, we'll simulate a successful authentication
    if (code) {
      // Set authentication information in localStorage
      localStorage.setItem('isAuthenticated', 'true');
      localStorage.setItem('user', JSON.stringify({
        name: 'Demo User',
        avatar: 'https://via.placeholder.com/50',
        username: 'demo-user'
      }));
      localStorage.setItem('userRoles', JSON.stringify(['writer']));
      
      // Update status message
      document.getElementById('status-message').textContent = 'Authentication successful! Redirecting...';
      
      // Redirect back to the main application
      setTimeout(() => {
        window.location.href = '/';
      }, 2000);
    } else {
      // Handle authentication error
      document.getElementById('status-message').textContent = 'Authentication failed. Please try again.';
      
      // Redirect back to the main application
      setTimeout(() => {
        window.location.href = '/';
      }, 3000);
    }
  </script>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
